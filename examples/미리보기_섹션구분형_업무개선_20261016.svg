<text x="66.93" y="212.73" font-size="18" font-family="'Malgun Gothic Bold','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="111.06" lengthAdjust="spacing">Ⅰ. 추진 개요</text>
<line x1="59.52" y1="190.36" x2="538.61" y2="190.36" stroke="#0000FF" stroke-width="1.42"/>
<line x1="59.52" y1="222.5" x2="538.61" y2="222.5" stroke="#0000FF" stroke-width="1.42"/>
<text x="56.69" y="254.11" font-size="15" font-family="'Malgun Gothic Bold','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="86.25" lengthAdjust="spacing">1. 추진 목적</text>
<text x="72.69" y="281.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="414.25" lengthAdjust="spacing">○ 반복 업무를 정리하고 담당자 간 협업 절차를 명확히 합니다.</text>
<text x="72.69" y="308.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="296.12" lengthAdjust="spacing">○ 문서 작성과 검토에 드는 시간을 줄입니다.</text>
<text x="56.69" y="341.11" font-size="15" font-family="'Malgun Gothic Bold','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="86.25" lengthAdjust="spacing">2. 운영 방향</text>
<text x="72.69" y="368.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="455.72" lengthAdjust="spacing">○ 작은 범위에서 먼저 실행하고 결과를 확인해 적용 범위를 넓힙니다.</text>
<text x="66.93" y="416.73" font-size="18" font-family="'Malgun Gothic Bold','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="111.06" lengthAdjust="spacing">Ⅱ. 실행 계획</text>
<line x1="59.52" y1="394.36" x2="538.61" y2="394.36" stroke="#0000FF" stroke-width="1.42"/>
<line x1="59.52" y1="426.5" x2="538.61" y2="426.5" stroke="#0000FF" stroke-width="1.42"/>
<text x="56.69" y="458.11" font-size="15" font-family="'Malgun Gothic Bold','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="86.25" lengthAdjust="spacing">1. 준비 단계</text>
<text x="72.69" y="485.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="420.95" lengthAdjust="spacing">○ 현재 업무 흐름을 살펴보고 개선이 필요한 항목을 선정합니다.</text>
<text x="72.69" y="512.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="293.55" lengthAdjust="spacing">○ 담당자와 일정, 확인할 결과물을 정합니다.</text>
<text x="56.69" y="545.11" font-size="15" font-family="'Malgun Gothic Bold','Malgun Gothic','HCR Dotum','Noto Sans KR',sans-serif" textLength="108.3" lengthAdjust="spacing">2. 실행 및 점검</text>
<text x="72.69" y="572.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="316.64" lengthAdjust="spacing">○ 개선안을 적용하고 참여자의 의견을 모읍니다.</text>
<text x="72.69" y="599.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="393.3" lengthAdjust="spacing">○ 실행 결과와 보완 사항을 정리해 다음 운영에 반영합니다.</text>
