<text x="86.69" y="434.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="116.71" lengthAdjust="spacing">2) 검토 결과 정리</text>
<text x="71.69" y="467.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="87.92" lengthAdjust="spacing">나. 실행 단계</text>
