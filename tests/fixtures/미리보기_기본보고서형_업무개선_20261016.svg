<text x="56.69" y="188.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="81.94" lengthAdjust="spacing">1. 추진 개요</text>
<text x="71.69" y="215.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="87.92" lengthAdjust="spacing">가. 추진 목적</text>
<text x="86.69" y="242.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="412.82" lengthAdjust="spacing">1) 반복 업무를 정리하고 담당자 간 협업 절차를 명확히 합니다.</text>
<text x="86.69" y="269.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="294.69" lengthAdjust="spacing">2) 문서 작성과 검토에 드는 시간을 줄입니다.</text>
<text x="71.69" y="302.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="87.92" lengthAdjust="spacing">나. 운영 방향</text>
<text x="86.69" y="329.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="434.77" lengthAdjust="spacing">작은 범위에서 먼저 실행하고 결과를 확인해 적용 범위를 넓힙니다.</text>
<text x="56.69" y="368.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="81.94" lengthAdjust="spacing">2. 실행 계획</text>
<text x="71.69" y="395.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="87.92" lengthAdjust="spacing">가. 준비 단계</text>
<text x="86.69" y="422.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="419.52" lengthAdjust="spacing">1) 현재 업무 흐름을 살펴보고 개선이 필요한 항목을 선정합니다.</text>
<text x="86.69" y="449.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="292.13" lengthAdjust="spacing">2) 담당자와 일정, 확인할 결과물을 정합니다.</text>
<text x="71.69" y="482.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="108.87" lengthAdjust="spacing">나. 실행 및 점검</text>
<text x="86.69" y="509.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="315.21" lengthAdjust="spacing">1) 개선안을 적용하고 참여자의 의견을 모읍니다.</text>
<text x="86.69" y="536.11" font-size="15" font-family="'휴먼명조','HCR Batang','Batang','Noto Serif KR',serif" textLength="391.88" lengthAdjust="spacing">2) 실행 결과와 보완 사항을 정리해 다음 운영에 반영합니다.</text>
</g></g>
</svg>